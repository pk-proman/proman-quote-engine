<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROMAN 3D Plant Layout</title>
<style>
  :root {
    --navy:#1F3864; --blue:#2E75B6; --yellow:#F2CC0C; --green:#375623;
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e;
    --font:'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;overflow:hidden;height:100vh;display:flex;flex-direction:column;}

  /* HEADER */
  header{background:var(--navy);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:10;}
  header h1{font-size:14px;letter-spacing:.4px;}
  header .meta{font-size:11px;color:#a0b8d8;margin-left:8px;}
  .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .btn{padding:5px 12px;border-radius:4px;border:none;cursor:pointer;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:.15s;}
  .btn-yellow{background:var(--yellow);color:var(--navy);}
  .btn-yellow:hover{background:#d4b008;}
  .btn-outline{background:transparent;color:#a0b8d8;border:1px solid #4a5568;}
  .btn-outline:hover{background:#2d3748;color:white;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* BODY */
  .body{display:flex;flex:1;overflow:hidden;}

  /* CANVAS */
  #canvas-wrap{flex:1;position:relative;background:var(--bg);}
  #c{display:block;width:100%;height:100%;}

  /* CONTROLS OVERLAY */
  .ctrl-hint{position:absolute;bottom:12px;left:12px;font-size:10px;color:#4a5568;line-height:1.6;pointer-events:none;}

  /* LOADING */
  #loading{position:absolute;inset:0;background:rgba(13,17,23,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:50;}
  .spinner{width:36px;height:36px;border:3px solid #30363d;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading p{color:var(--muted);font-size:12px;}

  /* RIGHT PANEL */
  .panel{width:340px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
  .panel-tabs{display:flex;border-bottom:1px solid var(--border);}
  .ptab{flex:1;padding:8px;text-align:center;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;background:transparent;border:none;color:var(--muted);}
  .ptab.active{color:var(--blue);border-bottom:2px solid var(--blue);}
  .panel-body{flex:1;overflow-y:auto;padding:12px;}
  .panel-section{margin-bottom:14px;}
  .panel-section h3{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px;}

  /* BOM TABLE */
  .bom-table{width:100%;border-collapse:collapse;font-size:11px;}
  .bom-table th{background:#21262d;color:var(--muted);padding:4px 6px;text-align:left;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;}
  .bom-table td{padding:4px 6px;border-bottom:1px solid #21262d;vertical-align:top;}
  .bom-table tr:hover td{background:#21262d;}
  .cat-badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.3px;}
  .cat-VGF{background:#7c4a00;color:#fcd34d;}
  .cat-JAW{background:#7f1d1d;color:#fca5a5;}
  .cat-CONE{background:#1e3a5f;color:#93c5fd;}
  .cat-VSI{background:#4a1d96;color:#c4b5fd;}
  .cat-SCREEN{background:#064e3b;color:#6ee7b7;}
  .cat-BIN{background:#1f2937;color:#9ca3af;}
  .cat-CONVEYOR{background:#78350f;color:#fcd34d;}
  .cat-ELECTRICAL{background:#1e3a5f;color:#7dd3fc;}

  /* EQUIPMENT DETAIL CARD */
  .eq-card{background:#21262d;border:1px solid var(--border);border-radius:5px;padding:10px;margin-bottom:8px;}
  .eq-card h4{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
  .eq-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .eq-card p{font-size:11px;color:var(--muted);line-height:1.5;}
  .eq-card .specs{font-size:10px;color:#58a6ff;margin-top:4px;font-family:monospace;}

  /* SELECTED HIGHLIGHT */
  .eq-card.selected{border-color:var(--yellow);background:#1a1400;}

  /* PLANT INFO */
  .info-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #21262d;font-size:11px;}
  .info-row:last-child{border-bottom:none;}
  .info-key{color:var(--muted);}
  .info-val{font-weight:600;color:var(--text);}

  /* ERROR */
  .error-box{background:#450a0a;border:1px solid #7f1d1d;border-radius:5px;padding:12px;color:#fca5a5;font-size:12px;}

  /* TOOLTIP */
  #tooltip{position:absolute;background:#1c2128;border:1px solid var(--border);border-radius:4px;padding:6px 9px;font-size:11px;pointer-events:none;display:none;max-width:200px;z-index:20;color:var(--text);}
  #tooltip .tt-title{font-weight:700;margin-bottom:2px;color:var(--yellow);}
  #tooltip .tt-sub{color:var(--muted);font-size:10px;}
</style>
</head>
<body>

<header>
  <div style="width:26px;height:26px;background:#2E75B6;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px">P</div>
  <h1>PROMAN 3D Plant Layout</h1>
  <span class="meta" id="hdr-meta">Loading…</span>
  <div class="hdr-right">
    <button class="btn btn-outline" onclick="resetCamera()" title="Reset camera">⬚ Reset View</button>
    <button class="btn btn-outline" onclick="toggleLabels()" id="btn-labels">🏷 Labels</button>
    <button class="btn btn-yellow" id="btn-bom" onclick="downloadBOM()" disabled>⬇ BOM (.xlsx)</button>
  </div>
</header>

<div class="body">
  <!-- 3D CANVAS -->
  <div id="canvas-wrap">
    <canvas id="c"></canvas>

    <div id="loading">
      <div class="spinner"></div>
      <p>Loading plant layout data…</p>
    </div>

    <div id="tooltip">
      <div class="tt-title" id="tt-title"></div>
      <div class="tt-sub" id="tt-sub"></div>
    </div>

    <div class="ctrl-hint">
      🖱 Drag to orbit &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Right-drag to pan &nbsp;·&nbsp; Click equipment to select
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">
    <div class="panel-tabs">
      <button class="ptab active" onclick="switchPanel('bom',this)">📋 BOM</button>
      <button class="ptab" onclick="switchPanel('equipment',this)">⚙️ Equipment</button>
      <button class="ptab" onclick="switchPanel('info',this)">ℹ Info</button>
    </div>
    <div class="panel-body" id="panel-bom">
      <div class="panel-section"><h3>Bill of Materials</h3>
        <div id="bom-content"><p style="color:var(--muted);font-size:11px">Loading…</p></div>
      </div>
    </div>
    <div class="panel-body" id="panel-equipment" style="display:none">
      <div class="panel-section"><h3>Equipment Schedule</h3>
        <div id="eq-content"><p style="color:var(--muted);font-size:11px">Loading…</p></div>
      </div>
    </div>
    <div class="panel-body" id="panel-info" style="display:none">
      <div class="panel-section"><h3>Plant Summary</h3>
        <div id="info-content"><p style="color:var(--muted);font-size:11px">Loading…</p></div>
      </div>
    </div>
  </div>
</div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// PARAMS FROM URL
// ============================================================
const params = new URLSearchParams(location.search);
const TPH = parseInt(params.get('tph')||'250');
const STAGES = parseInt(params.get('stages')||'3');
const MATERIAL = params.get('material')||'Granite';
let layoutData = null;
let showLabels = true;

// ============================================================
// THREE.JS SCENE SETUP
// ============================================================
const canvas = document.getElementById('c');
const wrap   = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x0d1117);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d1117, 80, 200);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
let cameraTarget = new THREE.Vector3(25, 0, 0);
camera.position.set(30, 25, 35);
camera.lookAt(cameraTarget);

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff4e0, 1.2);
sun.position.set(40, 60, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 200;
sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
sun.shadow.camera.top  =  60; sun.shadow.camera.bottom = -20;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8ab4f8, 0.3);
fill.position.set(-30, 20, -20);
scene.add(fill);

// Ground grid
const gridHelper = new THREE.GridHelper(120, 60, 0x21262d, 0x21262d);
scene.add(gridHelper);

// Ground plane (shadow receiver)
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshLambertMaterial({color:0x0d1117});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// ============================================================
// ORBIT CONTROLS (inline minimal implementation)
// ============================================================
const state = {
  dragging:false, rightDragging:false,
  lastX:0, lastY:0,
  theta:-0.4, phi:0.8, radius:55,
  panX:0, panY:0
};

function updateCamera(){
  const x = state.panX + state.radius * Math.sin(state.phi) * Math.cos(state.theta);
  const y = state.radius * Math.cos(state.phi);
  const z = state.panY + state.radius * Math.sin(state.phi) * Math.sin(state.theta);
  camera.position.set(cameraTarget.x+x, Math.max(1,y), cameraTarget.z+z);
  camera.lookAt(cameraTarget.x+state.panX/3, cameraTarget.y, cameraTarget.z+state.panY/3);
}

canvas.addEventListener('mousedown', e=>{
  if(e.button===0){state.dragging=true;}
  else if(e.button===2){state.rightDragging=true;}
  state.lastX=e.clientX; state.lastY=e.clientY;
  e.preventDefault();
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('mouseup',()=>{state.dragging=false;state.rightDragging=false;});
window.addEventListener('mousemove',e=>{
  const dx=e.clientX-state.lastX, dy=e.clientY-state.lastY;
  if(state.dragging){
    state.theta -= dx*0.005;
    state.phi   = Math.max(0.15, Math.min(Math.PI*0.48, state.phi + dy*0.005));
  } else if(state.rightDragging){
    state.panX -= dx*0.05;
    state.panY += dy*0.05;
  }
  state.lastX=e.clientX; state.lastY=e.clientY;
  updateCamera();
});
canvas.addEventListener('wheel',e=>{
  state.radius = Math.max(5, Math.min(120, state.radius + e.deltaY*0.05));
  updateCamera(); e.preventDefault();
},{passive:false});
// Touch support
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){state.dragging=true;state.lastX=e.touches[0].clientX;state.lastY=e.touches[0].clientY;}
},{passive:true});
canvas.addEventListener('touchend',()=>{state.dragging=false;});
canvas.addEventListener('touchmove',e=>{
  if(state.dragging&&e.touches.length===1){
    const dx=e.touches[0].clientX-state.lastX, dy=e.touches[0].clientY-state.lastY;
    state.theta-=dx*0.005;
    state.phi=Math.max(0.15,Math.min(Math.PI*0.48,state.phi+dy*0.005));
    state.lastX=e.touches[0].clientX;state.lastY=e.touches[0].clientY;
    updateCamera();
  }
},{passive:true});

function resetCamera(){
  state.theta=-0.4; state.phi=0.8; state.radius=55; state.panX=0; state.panY=0;
  updateCamera();
}

// ============================================================
// RAYCASTING / SELECTION
// ============================================================
const raycaster = new THREE.Raycaster();
const mouse2d = new THREE.Vector2();
let sceneObjects = []; // {mesh, item}
let selectedMesh = null;
const tooltip = document.getElementById('tooltip');

canvas.addEventListener('mousemove', e=>{
  const rect = canvas.getBoundingClientRect();
  mouse2d.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse2d.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse2d, camera);
  const hits = raycaster.intersectObjects(sceneObjects.map(o=>o.mesh));
  if(hits.length>0){
    const obj = sceneObjects.find(o=>o.mesh===hits[0].object);
    if(obj&&obj.item){
      tooltip.style.display='block';
      tooltip.style.left=(e.clientX-rect.left+12)+'px';
      tooltip.style.top=(e.clientY-rect.top-30)+'px';
      document.getElementById('tt-title').textContent=obj.item.label;
      document.getElementById('tt-sub').textContent=obj.item.specs||obj.item.category;
      canvas.style.cursor='pointer';
    }
  } else {
    tooltip.style.display='none';
    canvas.style.cursor='default';
  }
});

canvas.addEventListener('click', e=>{
  const rect = canvas.getBoundingClientRect();
  mouse2d.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse2d.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse2d, camera);
  const hits = raycaster.intersectObjects(sceneObjects.map(o=>o.mesh));
  if(hits.length>0){
    const obj = sceneObjects.find(o=>o.mesh===hits[0].object);
    if(obj) selectEquipment(obj);
  }
});

function selectEquipment(obj){
  // Reset all
  sceneObjects.forEach(o=>{ if(o.origColor) o.mesh.material.emissive.setHex(0); });
  if(obj.mesh===selectedMesh){selectedMesh=null;return;}
  selectedMesh=obj.mesh;
  obj.mesh.material.emissive.setHex(0x3a2a00);
  // Highlight in equipment panel
  document.querySelectorAll('.eq-card').forEach(c=>c.classList.remove('selected'));
  const card=document.getElementById('eq-'+obj.item.id);
  if(card){card.classList.add('selected');card.scrollIntoView({behavior:'smooth',block:'nearest'});}
  // Switch to equipment tab
  switchPanel('equipment', document.querySelector('.ptab:nth-child(2)'));
}

// ============================================================
// LABEL SPRITES
// ============================================================
const labelGroup = new THREE.Group();
scene.add(labelGroup);
const labelSprites = [];

function makeTextSprite(text, color='#ffffff'){
  const cv = document.createElement('canvas');
  cv.width=256; cv.height=48;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='rgba(0,0,0,0)';
  ctx.fillRect(0,0,256,48);
  ctx.font='bold 18px Segoe UI, sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillStyle=color;
  ctx.fillText(text,128,24);
  const tex=new THREE.CanvasTexture(cv);
  const mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false});
  const sp=new THREE.Sprite(mat);
  sp.scale.set(4,0.75,1);
  return sp;
}

function addLabel(text,x,y,z,color='#e6edf3'){
  const sp=makeTextSprite(text,color);
  sp.position.set(x,y,z);
  labelGroup.add(sp);
  labelSprites.push(sp);
}

function toggleLabels(){
  showLabels=!showLabels;
  labelGroup.visible=showLabels;
  document.getElementById('btn-labels').style.opacity=showLabels?'1':'0.4';
}

// ============================================================
// CONVEYOR BELT DRAWING
// ============================================================
function drawConveyor(from, to, color=0x8a7a50){
  const dir=new THREE.Vector3().subVectors(to,from);
  const len=dir.length();
  const mid=new THREE.Vector3().addVectors(from,to).multiplyScalar(.5);
  const geo=new THREE.BoxGeometry(len,0.15,0.5);
  const mat=new THREE.MeshLambertMaterial({color});
  const belt=new THREE.Mesh(geo,mat);
  belt.position.copy(mid);
  belt.lookAt(to);
  belt.rotateY(Math.PI/2);
  // Support legs
  const legGeo=new THREE.CylinderGeometry(.05,.05,mid.y,4);
  const legMat=new THREE.MeshLambertMaterial({color:0x404040});
  const step=len>8?4:2;
  for(let t=0.2;t<1;t+=step/len){
    const pt=new THREE.Vector3().lerpVectors(from,to,t);
    if(pt.y<0.3) continue;
    const leg=new THREE.Mesh(legGeo,legMat);
    leg.position.set(pt.x,pt.y/2,pt.z);
    scene.add(leg);
  }
  scene.add(belt);
  return belt;
}

// ============================================================
// BUILD 3D SCENE FROM DATA
// ============================================================
function buildScene(data){
  const positions = data.positions;
  const catColors = {
    HOPPER:0xD97706, VGF:0xF59E0B, JAW:0xDC2626, CONE:0x2563EB,
    VSI:0x7C3AED, SCREEN:0x059669, BIN:0x4B5563, CONVEYOR:0x8a7a50,
    STOCKPILE:0x92400E
  };

  // Center camera on midpoint of plant
  const midX = (data.plant_length_m||50)/2;
  cameraTarget.set(midX, 0, 0);
  state.radius = Math.max(40, data.plant_length_m||50) * 1.1;
  updateCamera();

  positions.forEach(item=>{
    if(item.stockpile){
      // Conical stockpile
      const geo=new THREE.ConeGeometry(4,3.5,16);
      const mat=new THREE.MeshLambertMaterial({color:0x92400E,transparent:true,opacity:0.7});
      for(let i=0;i<3;i++){
        const m=new THREE.Mesh(geo,mat);
        m.position.set(item.pos[0]+i*4, 1.75, item.pos[2]);
        scene.add(m);
      }
      return;
    }

    const [sx,sy,sz]=item.size;
    const [px,py,pz]=item.pos;
    const elev=item.elevation||0;

    // Support structure (grey pillar) for elevated equipment
    if(elev>0.5){
      const pillarH=elev;
      const pGeo=new THREE.BoxGeometry(sx*0.5,pillarH,sz*0.5);
      const pMat=new THREE.MeshLambertMaterial({color:0x2d3748,transparent:true,opacity:0.6});
      const pillar=new THREE.Mesh(pGeo,pMat);
      pillar.position.set(px+sx/2,pillarH/2,pz);
      pillar.castShadow=true;
      scene.add(pillar);
      // Access platform
      const platGeo=new THREE.BoxGeometry(sx*0.8,0.1,sz+1);
      const platMat=new THREE.MeshLambertMaterial({color:0x4a5568,transparent:true,opacity:0.8});
      const plat=new THREE.Mesh(platGeo,platMat);
      plat.position.set(px+sx/2,elev,pz);
      scene.add(plat);
    }

    // Main equipment box
    const geo=new THREE.BoxGeometry(sx,sy,sz);
    const color=catColors[item.category]||0x6b7280;
    const mat=new THREE.MeshLambertMaterial({color,transparent:true,opacity:0.92});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(px+sx/2, elev+sy/2, pz);
    mesh.castShadow=true;
    mesh.receiveShadow=true;
    scene.add(mesh);
    sceneObjects.push({mesh,item});

    // Edge highlight
    const edges=new THREE.EdgesGeometry(geo);
    const eMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.12});
    const wireframe=new THREE.LineSegments(edges,eMat);
    wireframe.position.copy(mesh.position);
    scene.add(wireframe);

    // Label above equipment
    addLabel(item.label, px+sx/2, elev+sy+0.8, pz,
      item.category==='JAW'?'#fca5a5':
      item.category==='CONE'?'#93c5fd':
      item.category==='VSI'?'#c4b5fd':
      item.category==='SCREEN'?'#6ee7b7':'#e6edf3');

    // Small category icon texture on top face (colored plane)
    const topGeo=new THREE.PlaneGeometry(sx*0.6,sz*0.6);
    const topMat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.4});
    const top=new THREE.Mesh(topGeo,topMat);
    top.rotation.x=-Math.PI/2;
    top.position.set(px+sx/2, elev+sy+0.02, pz);
    scene.add(top);
  });

  // Draw conveyors between major items
  const byId={};
  positions.forEach(it=>byId[it.id]=it);
  const conveyorPairs=[
    ['vgf','jaw'],['jaw','surge1'],['surge1','cone'],
    ['cone','screen_int'],['screen_int','vsi'],['vsi','screen_final'],
    ['screen_final','stockpile'],['cone','screen_final'],
    ['jaw','screen_final'],['surge2','vsi']
  ];
  conveyorPairs.forEach(([a,b])=>{
    const A=byId[a], B=byId[b];
    if(!A||!B) return;
    const fromP=new THREE.Vector3(A.pos[0]+A.size[0],A.elevation+A.size[1]*0.4,A.pos[2]);
    const toP  =new THREE.Vector3(B.pos[0],B.elevation+B.size[1]*0.5,B.pos[2]);
    // Only draw if horizontal gap > 0.5m
    if(toP.x-fromP.x>0.5) drawConveyor(fromP,toP);
  });

  // Floor-level feed hopper chute
  if(byId['hopper']&&byId['vgf']){
    const h=byId['hopper'], v=byId['vgf'];
    const from=new THREE.Vector3(h.pos[0]+h.size[0],h.elevation+0.5,h.pos[2]);
    const to=new THREE.Vector3(v.pos[0],v.elevation+0.5,v.pos[2]);
    drawConveyor(from,to,0xa07840);
  }
}

// ============================================================
// PANEL RENDERING
// ============================================================
function renderBOM(bom){
  const el=document.getElementById('bom-content');
  const rows=bom.map(r=>`
    <tr>
      <td style="text-align:center;color:var(--muted)">${r.sl}</td>
      <td><span class="cat-badge cat-${r.category}">${r.category}</span></td>
      <td>${r.description}</td>
      <td style="text-align:center">${r.qty}</td>
    </tr>`).join('');
  el.innerHTML=`<table class="bom-table">
    <thead><tr><th>#</th><th>Cat</th><th>Description</th><th>Qty</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderEquipment(positions){
  const catColors={
    HOPPER:'#D97706',VGF:'#F59E0B',JAW:'#DC2626',CONE:'#2563EB',
    VSI:'#7C3AED',SCREEN:'#059669',BIN:'#6B7280',CONVEYOR:'#8a7a50'
  };
  const el=document.getElementById('eq-content');
  const cards=positions.filter(it=>it.bom_include).map(it=>`
    <div class="eq-card" id="eq-${it.id}" onclick="focusEquipment('${it.id}')">
      <h4>
        <span class="eq-dot" style="background:${catColors[it.category]||'#6b7280'}"></span>
        ${it.label}
      </h4>
      <p>${it.category} · Stage ${it.stage}${it.elevation>0?' · Elevated '+it.elevation+'m':''}</p>
      ${it.specs?`<div class="specs">${it.specs}</div>`:''}
    </div>`).join('');
  el.innerHTML=cards||'<p style="color:var(--muted)">No equipment data.</p>';
}

function renderInfo(data){
  const s=data.schedule;
  const cuts=(s.gradation&&s.gradation.cuts_mm||[]).join(' / ');
  const prods=(s.gradation&&s.gradation.products||[]).join(', ');
  const el=document.getElementById('info-content');
  el.innerHTML=`
  <div class="info-row"><span class="info-key">Capacity</span><span class="info-val">${data.tph} TPH</span></div>
  <div class="info-row"><span class="info-key">Stages</span><span class="info-val">${data.stages}-Stage</span></div>
  <div class="info-row"><span class="info-key">Material</span><span class="info-val">${data.material}</span></div>
  <div class="info-row"><span class="info-key">Material Group</span><span class="info-val">${s.material_group||'—'}</span></div>
  <div class="info-row"><span class="info-key">Plant Footprint</span><span class="info-val">${data.plant_length_m||'—'}m × ~20m</span></div>
  <div class="info-row"><span class="info-key">Screen Cuts</span><span class="info-val">${cuts||'—'} mm</span></div>
  <div class="info-row"><span class="info-key">Products</span><span class="info-val" style="font-size:10px">${prods||'—'}</span></div>
  <div class="info-row"><span class="info-key">VGF</span><span class="info-val" style="font-size:10px">${s.vgf&&s.vgf.model||'—'}</span></div>
  <div class="info-row"><span class="info-key">Primary Jaw</span><span class="info-val" style="font-size:10px">${s.jaw&&s.jaw.model||'—'} CSS ${s.jaw&&s.jaw.css_mm||''}mm</span></div>
  <div class="info-row"><span class="info-key">Secondary Cone</span><span class="info-val" style="font-size:10px">${s.cone&&s.cone.model||'—'} CSS ${s.cone&&s.cone.css_mm||''}mm</span></div>
  ${s.vsi?`<div class="info-row"><span class="info-key">Tertiary VSI</span><span class="info-val" style="font-size:10px">${s.vsi.model}</span></div>`:''}
  <div class="info-row"><span class="info-key">Gradation Std</span><span class="info-val">${s.gradation&&s.gradation.standard||'IS 383'}</span></div>
  ${(s.notes||[]).length?`<div style="margin-top:10px;padding:8px;background:#21262d;border-radius:4px;font-size:10px;color:var(--muted)">${s.notes.join('<br>')}</div>`:''}`
  ;
}

function focusEquipment(id){
  const obj=sceneObjects.find(o=>o.item&&o.item.id===id);
  if(obj) selectEquipment(obj);
}

function switchPanel(name, btn){
  ['bom','equipment','info'].forEach(n=>{
    document.getElementById('panel-'+n).style.display=n===name?'block':'none';
  });
  document.querySelectorAll('.ptab').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

// ============================================================
// BOM EXCEL DOWNLOAD
// ============================================================
async function downloadBOM(){
  const client=document.getElementById('hdr-meta').textContent.split('·')[0].trim()||'Client';
  const url=`/api/layout/bom-excel?tph=${TPH}&stages=${STAGES}&material=${encodeURIComponent(MATERIAL)}&client=${encodeURIComponent(client)}`;
  const a=document.createElement('a'); a.href=url; a.download='BOM.xlsx'; a.click();
}

// ============================================================
// RESIZE
// ============================================================
function onResize(){
  const W=wrap.clientWidth, H=wrap.clientHeight;
  renderer.setSize(W,H,false);
  camera.aspect=W/H;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',onResize);

// ============================================================
// RENDER LOOP
// ============================================================
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}

// ============================================================
// FETCH DATA & BOOTSTRAP
// ============================================================
async function init(){
  try {
    const res=await fetch(`/api/layout/3d-data?tph=${TPH}&stages=${STAGES}&material=${encodeURIComponent(MATERIAL)}`);
    if(!res.ok){ throw new Error(await res.text()); }
    layoutData=await res.json();

    // Update header
    document.getElementById('hdr-meta').textContent=
      `${TPH} TPH · ${STAGES}-Stage · ${MATERIAL}  ·  Plant length ~${layoutData.plant_length_m}m`;
    document.title=`PROMAN 3D — ${TPH}TPH ${STAGES}-Stage`;

    // Build 3D scene
    buildScene(layoutData);

    // Populate panels
    renderBOM(layoutData.bom);
    renderEquipment(layoutData.positions);
    renderInfo(layoutData);

    // Enable BOM download
    document.getElementById('btn-bom').disabled=false;

    // Hide loading
    document.getElementById('loading').style.display='none';

    // Initial resize
    onResize();
    updateCamera();
  } catch(err){
    document.getElementById('loading').innerHTML=
      `<div class="error-box" style="max-width:400px">
        <strong>Error loading layout data</strong><br>${err.message}
       </div>`;
    console.error(err);
  }
}

onResize();
animate();
init();
</script>
</body>
</html>
