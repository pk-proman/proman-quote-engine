<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PROMAN 3D Plant Layout</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#header{display:flex;align-items:center;gap:10px;padding:0 14px;height:46px;background:linear-gradient(90deg,#0f2a4a,#162840);border-bottom:1px solid #1f3558;flex-shrink:0;user-select:none}
#plantTitle{font-size:13px;font-weight:700;color:#7eb9f5;white-space:nowrap;min-width:180px}
#viewTabs{display:flex;gap:4px;background:#0a1928;border-radius:6px;padding:3px}
.vtab{background:transparent;border:none;color:#7a8fa6;font-size:11px;font-weight:600;padding:4px 12px;border-radius:4px;cursor:pointer;transition:.2s}
.vtab.active{background:#1e4d8c;color:#fff}
.vtab:hover:not(.active){background:#1a2e48;color:#bcd}
#statsBar{font-size:11px;color:#5a7a9a;margin-left:6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btnBomXlsx{background:#1e6041;border:none;color:#7ef5b4;font-size:11px;font-weight:600;padding:5px 12px;border-radius:5px;cursor:pointer;white-space:nowrap}
#btnBomXlsx:hover{background:#26784f}
#btnClose{background:#3a1a1a;border:none;color:#f87171;font-size:12px;font-weight:700;padding:5px 10px;border-radius:5px;cursor:pointer;margin-left:4px}
#btnClose:hover{background:#5a2020}
#main{display:flex;flex:1;overflow:hidden}
#canvas3d{flex:1;display:block;outline:none}
#rightPanel{width:320px;flex-shrink:0;background:#0d1424;border-left:1px solid #1e3050;display:flex;flex-direction:column;overflow:hidden}
#panelTabs{display:flex;border-bottom:1px solid #1e3050;background:#0a1020;flex-shrink:0}
.ptab{flex:1;border:none;background:transparent;color:#6a8aa6;font-size:11px;font-weight:600;padding:9px 4px;cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.ptab.active{color:#7eb9f5;border-bottom-color:#2563eb}
.ptab:hover:not(.active){background:#0f1e34;color:#aac}
.panel-body{flex:1;overflow-y:auto;padding:10px}
.panel-body::-webkit-scrollbar{width:5px}
.panel-body::-webkit-scrollbar-track{background:#0d1424}
.panel-body::-webkit-scrollbar-thumb{background:#1e3050;border-radius:3px}
.info-card{background:#0f2040;border:1px solid #1e3a5c;border-radius:8px;padding:12px;margin-bottom:8px}
.info-card h3{font-size:12px;font-weight:700;color:#7eb9f5;margin-bottom:6px;border-bottom:1px solid #1e3a5c;padding-bottom:5px}
.info-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:#8faac0}
.info-row span:last-child{color:#c9d1d9;font-weight:500;text-align:right;max-width:60%}
.equip-chip{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;cursor:pointer;margin-bottom:4px;border:1px solid transparent;transition:.2s;font-size:11px}
.equip-chip:hover{background:#0f2040;border-color:#1e3a5c}
.equip-chip.selected{background:#0f2040;border-color:#2563eb}
.chip-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chip-name{font-weight:600;color:#c9d1d9;flex:1}
.chip-model{color:#6a8aa6;font-size:10px}
.bom-table{width:100%;border-collapse:collapse;font-size:10.5px}
.bom-table th{background:#0a1928;color:#7eb9f5;padding:5px 7px;text-align:left;font-weight:600;border-bottom:1px solid #1e3050;position:sticky;top:0;z-index:1}
.bom-table td{padding:5px 7px;border-bottom:1px solid #111d2e;vertical-align:top;color:#b0bec5}
.bom-table tr:hover td{background:#0f1e34}
.proc-section{margin-bottom:6px;border:1px solid #1e3050;border-radius:7px;overflow:hidden}
.proc-header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#0a1928;cursor:pointer;user-select:none;font-size:11px;font-weight:700;color:#7eb9f5}
.proc-header:hover{background:#0f2040}
.proc-count{background:#1e3a5c;color:#7eb9f5;font-size:10px;padding:2px 7px;border-radius:10px}
.proc-chevron{font-size:9px;color:#5a7a9a;transition:transform .2s}
.proc-content{display:none;overflow-x:auto;max-height:280px;overflow-y:auto}
.proc-content table{width:100%;border-collapse:collapse;font-size:10px;min-width:400px}
.proc-content th{background:#0f2040;color:#5a9af5;padding:4px 6px;text-align:left;position:sticky;top:0;font-size:9.5px}
.proc-content td{padding:3px 6px;border-bottom:1px solid #0f1e30;color:#a0b0c0;vertical-align:top}
.proc-content tr:hover td{background:#0f1e2e}
.empty-hint{text-align:center;padding:30px 20px;color:#4a6a8a;font-size:12px}
.section-label{font-size:9.5px;font-weight:700;color:#5a7a9a;text-transform:uppercase;letter-spacing:.06em;padding:6px 0 3px;margin-top:6px}
#loading{position:absolute;top:50%;left:40%;transform:translate(-50%,-50%);text-align:center;color:#5a7a9a;z-index:10;pointer-events:none}
#loading .spinner{width:36px;height:36px;border:3px solid #1e3050;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
#tooltip{position:fixed;background:#0a1928;border:1px solid #1e4080;border-radius:6px;padding:6px 10px;font-size:11px;color:#7eb9f5;pointer-events:none;display:none;z-index:100;max-width:240px;line-height:1.4}
</style>
</head>
<body>

<div id="header">
  <span id="plantTitle">🏗️ PROMAN 3D Plant Layout</span>
  <div id="viewTabs">
    <button class="vtab active" data-view="3d" onclick="switchView('3d')">⬡ 3D View</button>
    <button class="vtab" data-view="plan" onclick="switchView('plan')">⊞ Top Plan</button>
    <button class="vtab" data-view="elev" onclick="switchView('elev')">⊟ Front Elevation</button>
  </div>
  <div id="statsBar">Loading plant data…</div>
  <button id="btnBomXlsx" onclick="downloadBom()">⬇ Deep BOM Excel (6 sheets)</button>
  <button id="btnClose" onclick="window.close()">✕ Close</button>
</div>

<div id="main">
  <canvas id="canvas3d" tabindex="0"></canvas>
  <div id="rightPanel">
    <div id="panelTabs">
      <button class="ptab active" data-panel="info" onclick="switchPanel('info')">Equipment</button>
      <button class="ptab" data-panel="bom"  onclick="switchPanel('bom')">BOM</button>
      <button class="ptab" data-panel="proc" onclick="switchPanel('proc')">Procurement</button>
    </div>
    <div id="panelInfo" class="panel-body">
      <div class="empty-hint">Click any equipment in the 3D view to see details</div>
    </div>
    <div id="panelBom"  class="panel-body" style="display:none"></div>
    <div id="panelProc" class="panel-body" style="display:none"></div>
  </div>
</div>

<div id="loading"><div class="spinner"></div>Loading plant layout…</div>
<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';

const canvas = document.getElementById('canvas3d');
const params = new URLSearchParams(location.search);
const TPH    = parseInt(params.get('tph')    || 200);
const STAGES = parseInt(params.get('stages') || 2);
const MAT    = params.get('material') || 'Granite';

let scene, renderer, perspCam, orthoCam, controls;
let activeCamera, currentView = '3d';
let raycaster, mouse;
let plantLen = 80;
let meshGroups = {};
let allMeshes  = [];
let selectedId = null;
let prevHighlighted = [];

// ── Init ───────────────────────────────────────────────────────────
function init() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputEncoding = THREE.sRGBEncoding;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b111e);
  scene.fog = new THREE.FogExp2(0x0b111e, 0.006);

  perspCam = new THREE.PerspectiveCamera(45, 1, 0.1, 600);
  perspCam.position.set(40, 30, 55);

  orthoCam = new THREE.OrthographicCamera(-60, 60, 35, -35, -300, 300);

  activeCamera = perspCam;
  buildControls(perspCam);

  // Lights
  scene.add(new THREE.AmbientLight(0x8ab4d0, 0.5));
  const sun = new THREE.DirectionalLight(0xfff5e0, 1.4);
  sun.position.set(50, 60, 40);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left:-100, right:180, top:70, bottom:-20, near:1, far:250 });
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x4080b0, 0.4);
  fill.position.set(-30, 25, -30);
  scene.add(fill);
  const rim = new THREE.PointLight(0x1a5090, 0.5, 150);
  rim.position.set(50, 35, -25);
  scene.add(rim);

  addGround();

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();
  canvas.addEventListener('click', onCanvasClick);
  canvas.addEventListener('mousemove', onMouseMove);
  window.addEventListener('resize', onResize);
  onResize();
  animate();
}

function buildControls(cam) {
  if (controls && controls.dispose) controls.dispose();
  if (typeof THREE.OrbitControls !== 'undefined') {
    controls = new THREE.OrbitControls(cam, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 2;
    controls.maxDistance = 400;
    controls.maxPolarAngle = Math.PI * 0.88;
    controls.target.set(plantLen / 2, 4, 0);
    controls.update();
  } else {
    // Fallback stub — scene still renders, just no mouse interaction
    controls = { update(){}, dispose(){}, enableRotate:true, target: new THREE.Vector3(plantLen/2,4,0) };
    console.warn('OrbitControls not loaded — mouse interaction disabled');
  }
}

function addGround() {
  const gnd = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 120),
    new THREE.MeshStandardMaterial({ color: 0x0e1520, roughness: 0.95, metalness: 0 })
  );
  gnd.rotation.x = -Math.PI / 2;
  gnd.receiveShadow = true;
  scene.add(gnd);
  scene.add(new THREE.GridHelper(400, 80, 0x1a3050, 0x111d2a));
  const g2 = new THREE.GridHelper(400, 40, 0x1e3a5c, 0x182438);
  g2.position.y = 0.02;
  scene.add(g2);
}

// ── Materials ──────────────────────────────────────────────────────
function mat(hexColor, roughness=0.4, metalness=0.7) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(hexColor), roughness, metalness
  });
}

// ── Equipment Geometry ─────────────────────────────────────────────
function mkBox(w,h,d,m) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
function mkCyl(rt,rb,h,segs,m) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segs), m);
  mesh.castShadow = true; return mesh;
}
function mkCone(r,h,segs,m) {
  const mesh = new THREE.Mesh(new THREE.ConeGeometry(r,h,segs), m);
  mesh.castShadow = true; return mesh;
}
function add(g,...children) { children.forEach(c=>g.add(c)); return g; }

function buildHopper(w,h,d) {
  const g = new THREE.Group();
  const upper = mkBox(w, h*0.55, d, mat(0xc06010,0.5,0.5));
  upper.position.y = h*0.72;
  const lower = mkBox(w*0.55, h*0.42, d*0.55, mat(0x904808,0.5,0.5));
  lower.position.y = h*0.21;
  const rim   = mkBox(w+0.2, 0.14, d+0.2, mat(0x502408,0.4,0.75));
  rim.position.y = h;
  return add(g, upper, lower, rim);
}

function buildVGF(w,h,d) {
  const g = new THREE.Group();
  const body = mkBox(w,h,d, mat(0xd97706,0.5,0.55));
  body.position.y = h/2+0.3;
  body.rotation.z = THREE.MathUtils.degToRad(-3);
  g.add(body);
  // Vibrator motors
  [-w*0.28, w*0.28].forEach(xo => {
    const vm = mkBox(0.52,0.36,0.36, mat(0x111,0.4,0.85));
    vm.position.set(xo, h+0.52, 0);
    const spin = mkCyl(0.08,0.08,0.44,12, mat(0x444,0.3,0.9));
    spin.rotation.z = Math.PI/2;
    spin.position.set(xo+0.36, h+0.52, 0);
    g.add(vm, spin);
  });
  // Skirt side rails
  [-d/2-0.06, d/2+0.06].forEach(zo => {
    const sk = mkBox(w+0.1,0.06,0.06, mat(0x6b4800,0.6,0.6));
    sk.position.set(0, h+0.1, zo);
    g.add(sk);
  });
  return g;
}

function buildJaw(w,h,d) {
  const g = new THREE.Group();
  // Body
  const body = mkBox(w,h,d, mat(0xb91c1c,0.45,0.6));
  body.position.y = h/2;
  g.add(body);
  // Flywheels
  const fwR = h*0.44;
  [-w/2-0.24, w/2+0.24].forEach(xo => {
    const fw = mkCyl(fwR,fwR,0.28,36, mat(0x7f0000,0.35,0.85));
    fw.rotation.z = Math.PI/2;
    fw.position.set(xo, h*0.6, 0);
    const hub = mkCyl(0.12,0.12,0.38,16, mat(0x222,0.4,0.9));
    hub.rotation.z = Math.PI/2;
    hub.position.set(xo, h*0.6, 0);
    g.add(fw, hub);
    for (let i=0;i<4;i++) {
      const sp = mkBox(0.06,fwR*1.8,0.06, mat(0x5a0000,0.5,0.7));
      sp.rotation.z = i*Math.PI/4;
      sp.position.set(xo, h*0.6, 0);
      g.add(sp);
    }
  });
  // Top feed lip
  const lip = mkBox(w+0.1,0.12,d*0.85, mat(0x800000,0.4,0.7));
  lip.position.y = h+0.06;
  g.add(lip);
  return g;
}

function buildCone(w,h,d) {
  const g = new THREE.Group();
  const r = Math.min(w,d)/2;
  const base = mkCyl(r*0.85, r*0.9, h*0.35, 24, mat(0x1a3060,0.4,0.7));
  base.position.y = h*0.175;
  const ring = mkCyl(r,r*0.85,0.18,24, mat(0x112248,0.5,0.7));
  ring.position.y = h*0.35+0.09;
  // Cone body (wider at top = inverted cone = use cylinder tapered)
  const cone = mkCyl(r*0.95, r*0.55, h*0.55, 24, mat(0x1e4d9a,0.35,0.75));
  cone.position.y = h*0.35+0.18+(h*0.55/2);
  // Top cover
  const top = mkCyl(r*0.38, r*0.95, 0.22, 24, mat(0x2563eb,0.3,0.8));
  top.position.y = h;
  // Discharge skirt
  const skirt = mkCone(r*1.0, h*0.12, 24, mat(0x0f2040,0.5,0.65));
  skirt.position.y = h*0.35; skirt.rotation.x = Math.PI;
  // Drive bump
  const eccen = mkCyl(0.28,0.28,0.55,16, mat(0x111,0.4,0.85));
  eccen.rotation.z = Math.PI/2; eccen.position.set(r*0.9, h*0.2, 0);
  return add(g, base,ring,cone,top,skirt,eccen);
}

function buildVSI(w,h,d) {
  const g = new THREE.Group();
  const r = Math.min(w,d)/2;
  const body = mkCyl(r*1.05, r*1.05, h*0.6, 32, mat(0x5b21b6,0.35,0.7));
  body.position.y = h*0.3;
  const inlet = mkCone(r*0.45, h*0.38, 20, mat(0x4c1d95,0.35,0.7));
  inlet.position.y = h*0.6+h*0.19;
  const base  = mkCyl(r*1.15, r*1.05, h*0.12, 32, mat(0x3b0764,0.45,0.65));
  base.position.y = h*0.06;
  const shaft = mkCyl(0.12,0.12,h*0.22,12, mat(0x111,0.3,0.95));
  shaft.position.y = h*0.87;
  [0,Math.PI].forEach(a => {
    const door = mkBox(0.28,h*0.22,0.08, mat(0x222,0.5,0.75));
    door.position.set(Math.cos(a)*r*1.06, h*0.3, Math.sin(a)*r*1.06);
    door.rotation.y = a; g.add(door);
  });
  return add(g, body,inlet,base,shaft);
}

function buildScreen(w,h,d) {
  const g = new THREE.Group();
  const ang = THREE.MathUtils.degToRad(17);
  [[h*0.16,0x065f46],[h*0.52,0x047857],[h*0.84,0x059669]].forEach(([yy,col],i) => {
    const deck = mkBox(w*(1-i*0.06), h*0.26, d*(1-i*0.04), mat(col,0.42,0.62));
    deck.position.y = yy; deck.rotation.x = -ang;
    g.add(deck);
  });
  [-d/2-0.06, d/2+0.06].forEach(zo => {
    const frame = mkBox(w+0.1,h,0.1, mat(0x033020,0.5,0.7));
    frame.position.set(0,h/2,zo); frame.rotation.x=-ang; g.add(frame);
  });
  [-0.3, 0.3].forEach(xo => {
    const vib = mkCyl(0.22,0.22,0.34,16, mat(0x111,0.35,0.85));
    vib.rotation.z = Math.PI/2;
    vib.position.set(xo*w, h+0.2, 0); g.add(vib);
  });
  return g;
}

function buildBin(w,h,d) {
  const g = new THREE.Group();
  const body = mkBox(w,h*0.72,d, mat(0x374151,0.5,0.6));
  body.position.y = h*0.51;
  const cone = mkCone(Math.min(w,d)/2*0.9, h*0.28, 16, mat(0x1f2937,0.5,0.65));
  cone.position.y = h*0.14; cone.rotation.x = Math.PI;
  const rim  = mkBox(w+0.14,0.12,d+0.14, mat(0x555,0.4,0.8));
  rim.position.y = h*0.88;
  const ind  = mkBox(0.08,h*0.38,0.08, mat(0xf59e0b,0.3,0.5));
  ind.position.set(w/2+0.12,h*0.5,0);
  return add(g, body,cone,rim,ind);
}

function buildStockpile(w,d) {
  const g = new THREE.Group();
  const r = Math.min(w,d)/2*0.6;
  [0x92400e,0xa15c20,0x78350f].forEach((col,i) => {
    const pile = mkCone(r, r*0.7+0.3, 20, mat(col,0.98,0));
    pile.position.set((i-1)*(w/3), r*0.36, 0);
    g.add(pile);
  });
  return g;
}

function buildConvSegment(gapX, ay, by, bWidth) {
  const g = new THREE.Group();
  const dy = by - ay;
  const len = Math.sqrt(gapX*gapX + dy*dy);
  const angle = Math.atan2(dy, gapX);
  const midX = gapX/2, midY = (ay+by)/2;
  const BW = bWidth;

  // ── Belt surface ────────────────────────────────────────────────
  const belt = mkBox(len, 0.07, BW*0.72, mat(0x111111,0.9,0.05));
  belt.position.set(midX, midY+0.22, 0);
  belt.rotation.z = angle;
  g.add(belt);

  // ── Truss top chords (two C-channel stringers) ──────────────────
  [-BW*0.41, BW*0.41].forEach(zo => {
    const chord = mkBox(len, 0.13, 0.13, mat(0x2a3a4a,0.55,0.78));
    chord.position.set(midX, midY+0.13, zo);
    chord.rotation.z = angle;
    g.add(chord);
  });

  // ── Truss bottom chords ─────────────────────────────────────────
  [-BW*0.41, BW*0.41].forEach(zo => {
    const chord = mkBox(len, 0.10, 0.10, mat(0x243040,0.58,0.75));
    chord.position.set(midX, midY-0.32, zo);
    chord.rotation.z = angle;
    g.add(chord);
  });

  // ── Idlers + cross-members every ~1.8m ──────────────────────────
  const numIdlers = Math.max(3, Math.round(len/1.8));
  for (let i=0; i<=numIdlers; i++) {
    const t = i/numIdlers;
    const lx = gapX*t, ly = ay + dy*t;
    // Idler roller
    const idl = mkCyl(0.085, 0.085, BW*0.85, 8, mat(0x3a3a3a,0.5,0.7));
    idl.rotation.z = Math.PI/2;
    idl.position.set(lx, ly+0.18, 0);
    g.add(idl);
    // Horizontal cross-frame
    const xf = mkBox(0.07, 0.07, BW*0.9, mat(0x263646,0.6,0.72));
    xf.position.set(lx, ly+0.13, 0);
    g.add(xf);
    // Vertical webs connecting top to bottom chord
    [-BW*0.41, BW*0.41].forEach(zo => {
      const web = mkBox(0.06, 0.48, 0.06, mat(0x1e2d3d,0.65,0.68));
      web.position.set(lx, ly-0.10, zo);
      g.add(web);
    });
    // Diagonal bracing (alternate direction)
    if (i < numIdlers) {
      const nx = gapX*(i+1)/numIdlers, ny = ay + dy*(i+1)/numIdlers;
      [-BW*0.41, BW*0.41].forEach(zo => {
        const dl = Math.sqrt((nx-lx)**2+(ny-ly)**2+0.48**2);
        const diag = mkBox(dl, 0.05, 0.05, mat(0x1e2d3d,0.65,0.68));
        diag.position.set((lx+nx)/2, (ly+ny)/2-0.10, zo);
        diag.rotation.z = Math.atan2(ny-ly, nx-lx) * (i%2===0?1:-1);
        g.add(diag);
      });
    }
  }

  // ── Head pulley (discharge end) ──────────────────────────────────
  const hp = mkCyl(BW*0.39, BW*0.39, BW*0.88, 16, mat(0x333,0.4,0.85));
  hp.rotation.z = Math.PI/2;
  hp.position.set(gapX, by, 0);
  g.add(hp);

  // ── Tail pulley (feed end) ───────────────────────────────────────
  const tp = mkCyl(BW*0.35, BW*0.35, BW*0.88, 16, mat(0x333,0.4,0.85));
  tp.rotation.z = Math.PI/2;
  tp.position.set(0, ay, 0);
  g.add(tp);

  // ── Feed skirtboards ─────────────────────────────────────────────
  [-BW*0.36, BW*0.36].forEach(zo => {
    const sk = mkBox(BW*0.55, 0.55, 0.05, mat(0x1a1a2e,0.75,0.25));
    sk.position.set(gapX*0.07, ay+0.38, zo);
    sk.rotation.z = angle;
    g.add(sk);
  });

  // ── Support legs under truss ──────────────────────────────────────
  const numLegs = Math.max(2, Math.floor(len/4));
  for (let i=1; i<numLegs; i++) {
    const t = i/numLegs;
    const lx = gapX*t, ly = ay + dy*t;
    if (ly > 0.7) {
      [-BW*0.38, BW*0.38].forEach(zo => {
        const leg = mkBox(0.10, ly, 0.10, mat(0x253545,0.6,0.75));
        leg.position.set(lx, ly/2, zo);
        g.add(leg);
      });
      // Horizontal X-brace between the two legs
      const xb = mkBox(0.06, 0.06, BW*0.78, mat(0x1e2d3d,0.65,0.68));
      xb.position.set(lx, ly*0.38, 0);
      g.add(xb);
    }
  }
  return g;
}

function structColumns(cx, py, pw, pd) {
  const g = new THREE.Group();
  const h = py + 0.25;
  const corners = [[-pw*0.35,-pd*0.35],[-pw*0.35,pd*0.35],[pw*0.35,-pd*0.35],[pw*0.35,pd*0.35]];

  // ── Main columns (100×100 box section) ────────────────────────────
  corners.forEach(([ox,oz]) => {
    const col = mkBox(0.20, h, 0.20, mat(0x253545,0.55,0.75));
    col.position.set(cx+ox, h/2, oz);
    g.add(col);
  });

  // ── Platform beams at top (along both axes) ───────────────────────
  [-pd*0.35, pd*0.35].forEach(oz => {
    const b = mkBox(pw*0.72, 0.24, 0.20, mat(0x1e3050,0.5,0.8));
    b.position.set(cx, h+0.12, oz);
    g.add(b);
  });
  [-pw*0.35, pw*0.35].forEach(ox => {
    const b = mkBox(0.20, 0.20, pd*0.72, mat(0x1e3050,0.5,0.8));
    b.position.set(cx+ox, h+0.10, 0);
    g.add(b);
  });

  // ── Grating platform surface ──────────────────────────────────────
  const plat = mkBox(pw*0.74, 0.06, pd*0.74, mat(0x1a2a3a,0.85,0.55));
  plat.position.set(cx, h+0.21, 0);
  g.add(plat);

  // ── X-bracing on long faces (parallel to X) ───────────────────────
  const mBrace = new THREE.LineBasicMaterial({color:0x2a4060});
  [-pd*0.35, pd*0.35].forEach(oz => {
    [
      [cx-pw*0.35,0, cx+pw*0.35,h],
      [cx+pw*0.35,0, cx-pw*0.35,h]
    ].forEach(([x1,y1,x2,y2]) => {
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x1,y1,oz), new THREE.Vector3(x2,y2,oz)
      ]);
      g.add(new THREE.Line(geo, mBrace));
    });
  });

  // ── X-bracing on short faces (parallel to Z) ──────────────────────
  [-pw*0.35, pw*0.35].forEach(ox => {
    [
      [cx+ox,-pd*0.35,0, cx+ox,pd*0.35,h],
      [cx+ox,pd*0.35,0, cx+ox,-pd*0.35,h]
    ].forEach(([x1,z1,y1, x2,z2,y2]) => {
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x1,y1,z1), new THREE.Vector3(x2,y2,z2)
      ]);
      g.add(new THREE.Line(geo, mBrace));
    });
  });

  // ── Mid-height horizontal tie beams ───────────────────────────────
  if (h > 6) {
    const mh = h*0.5;
    [-pd*0.35, pd*0.35].forEach(oz => {
      const tb = mkBox(pw*0.72, 0.16, 0.16, mat(0x1e3050,0.55,0.72));
      tb.position.set(cx, mh, oz);
      g.add(tb);
    });
  }

  // ── Access stair on one side ──────────────────────────────────────
  const nSteps = Math.max(4, Math.round(h/0.42));
  for (let s=0; s<nSteps; s++) {
    const sy = (s+0.5)*h/nSteps;
    const sx = cx - pw*0.35 - 0.45 - s*0.28;
    const step = mkBox(0.48, 0.06, 0.85, mat(0x1e3050,0.75,0.5));
    step.position.set(sx, sy, pd*0.35+0.48);
    g.add(step);
  }
  // Stair handrail
  const rGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(cx-pw*0.35-0.45, 0.9, pd*0.35+0.48),
    new THREE.Vector3(cx-pw*0.35-0.45-nSteps*0.28, h*0.95, pd*0.35+0.48)
  ]);
  g.add(new THREE.Line(rGeo, new THREE.LineBasicMaterial({color:0x3a5a7a})));

  return g;
}

// ── Text sprite ────────────────────────────────────────────────────
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x, y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}
function mkLabel(text, dims) {
  const cv = document.createElement('canvas');
  cv.width = 320; cv.height = dims ? 78 : 58;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = 'rgba(8,20,44,0.82)';
  rrect(ctx,2,2,316,cv.height-4,8); ctx.fill();
  ctx.strokeStyle='rgba(126,185,245,0.35)';ctx.lineWidth=1;
  rrect(ctx,2,2,316,cv.height-4,8); ctx.stroke();
  ctx.fillStyle = '#7eb9f5';
  ctx.font = 'bold 19px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text.length>24 ? text.slice(0,23)+'…' : text, 160, dims ? 24 : cv.height/2);
  if (dims) {
    ctx.fillStyle = '#5a9ad0';
    ctx.font = '13px Arial';
    ctx.fillText(dims, 160, 56);
  }
  const tex = new THREE.CanvasTexture(cv);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  spr.scale.set(dims ? 5.2 : 4.2, dims ? 1.25 : 0.95, 1);
  spr.renderOrder = 999;
  return spr;
}

// ── Dimension annotation helper ────────────────────────────────────
function addDimLine(x1,y1,z1, x2,y2,z2, label, color=0x2a6090) {
  const mat2 = new THREE.LineBasicMaterial({color});
  // Main dimension line
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x1,y1,z1), new THREE.Vector3(x2,y2,z2)
  ]);
  scene.add(new THREE.Line(geo, mat2));
  // Tick marks (small perpendicular lines)
  const dx=x2-x1, dy=y2-y1;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  const ny=-dy/len*0.4, nx=dx/len*0.4;
  [[x1,y1],[x2,y2]].forEach(([tx,ty]) => {
    const tg = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(tx-nx*0.5,ty-ny*0.5,z1),
      new THREE.Vector3(tx+nx*0.5,ty+ny*0.5,z1)
    ]);
    scene.add(new THREE.Line(tg, mat2));
  });
  // Label sprite
  const cv2 = document.createElement('canvas');
  cv2.width=180; cv2.height=36;
  const ctx2=cv2.getContext('2d');
  ctx2.fillStyle='rgba(8,20,44,0.78)';
  rrect(ctx2,1,1,178,34,5); ctx2.fill();
  ctx2.fillStyle='#9ecaf0'; ctx2.font='bold 15px Arial';
  ctx2.textAlign='center'; ctx2.textBaseline='middle';
  ctx2.fillText(label,90,18);
  const tex2=new THREE.CanvasTexture(cv2);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex2,transparent:true,depthTest:false}));
  spr.scale.set(3.2,0.62,1);
  spr.position.set((x1+x2)/2,(y1+y2)/2+0.6,(z1+z2)/2);
  spr.renderOrder=998;
  scene.add(spr);
}

// ── Build Scene ────────────────────────────────────────────────────
function buildScene(positions) {
  allMeshes = []; meshGroups = {};

  positions.forEach(item => {
    const [pw,ph,pd] = item.size;
    const [px,py,pz] = item.pos;
    const cx = px + pw/2;
    let g;

    if (item.category === 'STOCKPILE') {
      g = buildStockpile(pw, pd);
      g.position.set(cx, 0, pz);
    } else {
      switch(item.category) {
        case 'HOPPER': g = buildHopper(pw,ph,pd); break;
        case 'VGF':    g = buildVGF(pw,ph,pd);    break;
        case 'JAW':    g = buildJaw(pw,ph,pd);     break;
        case 'CONE':   g = buildCone(pw,ph,pd);    break;
        case 'VSI':    g = buildVSI(pw,ph,pd);     break;
        case 'SCREEN': g = buildScreen(pw,ph,pd);  break;
        default:       g = buildBin(pw,ph,pd);     break;
      }
      g.position.set(cx, py, pz);
      // Structural columns for elevated equipment
      if (py >= 2.5) {
        const cols = structColumns(cx, py, pw, pd);
        scene.add(cols);
      }
    }

    g.userData = { id:item.id, item };
    g.traverse(c => {
      if (c.isMesh) {
        c.castShadow = true; c.receiveShadow = true;
        c.userData = { id:item.id, item };
        allMeshes.push(c);
      }
    });
    scene.add(g);
    meshGroups[item.id] = g;

    // Label with size annotation
    if (item.bom_include || item.category==='STOCKPILE') {
      const dimStr = `${(pw*1000).toFixed(0)} × ${(pd*1000).toFixed(0)} mm  H: ${(ph*1000).toFixed(0)} mm`;
      const lbl = mkLabel(item.label, dimStr);
      lbl.position.set(0, ph + 1.2, 0);
      g.add(lbl);
    }
  });

  // Connecting conveyors
  const seq = positions.filter(p=>p.bom_include);
  for (let i=0;i<seq.length-1;i++) {
    const a=seq[i], b=seq[i+1];
    const ax = a.pos[0]+a.size[0];
    const bx = b.pos[0];
    const gap = bx - ax;
    if (gap < 0.5) continue;
    const ay = a.pos[1]+a.size[1]*0.15;
    const by = b.pos[1]+b.size[1]*0.8;
    const cv = buildConvSegment(gap, ay, by, 0.9);
    cv.position.set(ax, 0, 0);
    scene.add(cv);
  }

  // ── Dimension annotations ──────────────────────────────────────────
  addDimensionAnnotations(positions);
}

function addDimensionAnnotations(positions) {
  if (!positions || !positions.length) return;
  const DIMZ = 6.5;   // Z offset for dimension lines (in front of plant)
  const ELVZ = -6.5;  // Z offset for elevation markers (behind plant)

  // Total plant length dimension (front, at ground level)
  const first = positions[0], last = positions[positions.length-1];
  const totalStart = first.pos[0];
  const totalEnd   = last.pos[0]+last.size[0];
  addDimLine(totalStart, -0.6, DIMZ, totalEnd, -0.6, DIMZ,
    `Plant length: ${(totalEnd-totalStart).toFixed(1)} m`, 0x1e6090);

  // Per-equipment width dimension at front face
  positions.forEach(item => {
    if (!item.bom_include) return;
    const [pw,ph,pd] = item.size, [px,py] = item.pos;
    const x1 = px, x2 = px+pw;
    addDimLine(x1, py-0.4, DIMZ, x2, py-0.4, DIMZ,
      `${(pw*1000).toFixed(0)} mm`, 0x1a4a6a);
  });

  // Elevation markers — vertical dimension lines on right side
  const elevMat = new THREE.LineBasicMaterial({color:0x1e5080});
  const RIGHT_X = totalEnd + 2.5;
  positions.forEach(item => {
    if (!item.bom_include || item.pos[1] < 1.5) return;
    const [pw,ph,pd] = item.size, [px,py] = item.pos;
    const cx = px+pw/2;
    // Vertical line from ground to equipment base
    const vGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(cx, 0, ELVZ), new THREE.Vector3(cx, py, ELVZ)
    ]);
    scene.add(new THREE.Line(vGeo, elevMat));
    // Horizontal reach line to equipment
    const hGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(cx, py, ELVZ), new THREE.Vector3(cx, py, item.pos[2]+pd/2+0.3)
    ]);
    scene.add(new THREE.Line(hGeo, elevMat));
    // Elevation label
    const cv2 = document.createElement('canvas');
    cv2.width=160; cv2.height=34;
    const ctx2=cv2.getContext('2d');
    ctx2.fillStyle='rgba(8,20,44,0.78)';
    rrect(ctx2,1,1,158,32,5); ctx2.fill();
    ctx2.fillStyle='#7ec8a0'; ctx2.font='bold 14px Arial';
    ctx2.textAlign='center'; ctx2.textBaseline='middle';
    ctx2.fillText(`EL: +${py.toFixed(1)} m`, 80, 17);
    const tex2=new THREE.CanvasTexture(cv2);
    const elevSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex2,transparent:true,depthTest:false}));
    elevSpr.scale.set(2.8,0.58,1);
    elevSpr.position.set(cx, py+0.5, ELVZ);
    elevSpr.renderOrder=997;
    scene.add(elevSpr);
  });

  // Equipment height dimension (vertical bar beside each piece)
  positions.forEach(item => {
    if (!item.bom_include) return;
    const [pw,ph,pd] = item.size, [px,py] = item.pos;
    const x2 = px+pw+0.6;
    addDimLine(x2, py, -pd/2, x2, py+ph, -pd/2,
      `H: ${(ph*1000).toFixed(0)} mm`, 0x1a5a40);
  });
}

// ── Camera switching ───────────────────────────────────────────────
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.vtab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  const mid = plantLen/2;

  if (view === '3d') {
    perspCam.position.set(mid, plantLen*0.34, plantLen*0.54);
    buildControls(perspCam);
    activeCamera = perspCam;
  } else {
    const aspect = canvas.clientWidth/canvas.clientHeight;
    const vw = plantLen*1.35;
    const vh = vw/aspect;
    orthoCam.left=-vw/2; orthoCam.right=vw/2;
    orthoCam.top=vh/2;   orthoCam.bottom=-vh/2;
    orthoCam.updateProjectionMatrix();
    activeCamera = orthoCam;
    buildControls(orthoCam);
    controls.enableRotate = false;

    if (view === 'plan') {
      orthoCam.position.set(mid, 90, 0.01);
      orthoCam.up.set(0, 0, -1);
      orthoCam.lookAt(mid, 0, 0);
      controls.target.set(mid, 0, 0);
    } else {
      orthoCam.position.set(mid, 14, 90);
      orthoCam.up.set(0, 1, 0);
      orthoCam.lookAt(mid, 14, 0);
      controls.target.set(mid, 14, 0);
    }
    controls.update();
  }
}

// ── Raycasting ─────────────────────────────────────────────────────
function onCanvasClick(e) {
  const r = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX-r.left)/r.width)*2-1;
  mouse.y = -((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouse, activeCamera);
  const hits = raycaster.intersectObjects(allMeshes, false);
  if (hits.length && hits[0].object.userData.id) {
    selectEquipment(hits[0].object.userData.id, hits[0].object.userData.item);
  }
}

function onMouseMove(e) {
  const r = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX-r.left)/r.width)*2-1;
  mouse.y = -((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouse, activeCamera);
  const hits = raycaster.intersectObjects(allMeshes, false);
  const tip = document.getElementById('tooltip');
  if (hits.length && hits[0].object.userData.id) {
    const it = hits[0].object.userData.item;
    tip.innerHTML = `<b>${it.label}</b><br><span style="color:#5a9af5">${it.model}</span>${it.specs?`<br><span style="color:#8a9ab0;font-size:10px">${it.specs}</span>`:''}`;
    tip.style.display='block';
    tip.style.left=(e.clientX+14)+'px';
    tip.style.top=(e.clientY-10)+'px';
  } else { tip.style.display='none'; }
}

function selectEquipment(id, item) {
  prevHighlighted.forEach(m=>m.material.emissive&&m.material.emissive.setHex(0));
  prevHighlighted = [];
  selectedId = id;
  const g = meshGroups[id];
  if (g) {
    g.traverse(c=>{
      if (c.isMesh&&c.material&&c.material.emissive) {
        c.material.emissive.setHex(0x102870); prevHighlighted.push(c);
      }
    });
  }
  document.querySelectorAll('.equip-chip').forEach(ch=>ch.classList.toggle('selected',ch.dataset.id===id));
  showItemInfo(item);
  switchPanel('info');
}

      <span class="chip-dot" style="background:${item.color}"></span>
      <span class="chip-name">${item.label}</span>
      <span class="chip-model">${item.model}</span>

    { key:'wear_parts',          label:'Wear Parts — Initial 2 Sets',       cols:['equipment','item','material','qty','life_hrs'] },
    { key:'consumables',         label:'Consumables & Lubricants',          cols:['item','material','qty','unit'] },
    { key:'structural',          label:'Structural Steel & Fabrication',    cols:['section','item','profile','qty_mt'] },
    { key:'conveyor_components', label:'Conveyor Components (Per Belt)',    cols:['conveyor','item','qty','unit'] },
  ].forEach(({key,label,cols}) => {

      <div class="proc-header" onclick="toggleProc(this)">

    <h3>Plant Summary</h3>

    <div class="info-row"><span>Main Belt Width</span><span>${st.belt_width_mm}mm</span></div>
    <div class="info-row"><span>Total Conveyors</span><span>${st.conveyor_count} belts</span></div>
    <div class="info-row"><span>Connected Load</span><span>~${Math.round(st.est_connected_kw||0)} kW</span></div>
  </div>`;

function showItemInfo(item) {
  const infoEl = document.getElementById('panelInfo');
  const emoji = {HOPPER:'📦',VGF:'〰️',JAW:'⚙️',CONE:'🔺',VSI:'🌀',SCREEN:'🟩',BIN:'🏺'}[item.category]||'🔧';
  let card = infoEl.querySelector('.selected-card');
  if (!card) {
    card = document.createElement('div');
    card.className = 'info-card selected-card';
    infoEl.insertBefore(card, infoEl.firstChild);
  }
  card.innerHTML = `
    <h3>${emoji} ${item.label}</h3>
    <div class="info-row"><span>Model</span><span>${item.model}</span></div>
    <div class="info-row"><span>Category</span><span>${item.category}</span></div>
    <div class="info-row"><span>Crushing Stage</span><span>${item.stage}</span></div>
    <div class="info-row"><span>Elevation</span><span>${item.pos[1].toFixed(1)} m</span></div>
    <div class="info-row"><span>Footprint (L×W)</span><span>${item.size[0]}×${item.size[2]} m</span></div>
    <div class="info-row"><span>Height</span><span>${item.size[1]} m</span></div>
    ${item.specs?`<div class="info-row" style="flex-direction:column;align-items:flex-start;gap:2px"><span style="color:#5a7a9a">Specs</span><span style="max-width:100%;text-align:left;color:#aac;margin-top:2px">${item.specs}</span></div>`:''}
  `;
}

function toggleProc(header) {
  const content = header.nextElementSibling;
  const open = content.style.display==='block';
  content.style.display = open?'none':'block';
  header.querySelector('.proc-chevron').style.transform = open?'':'rotate(90deg)';
}

function switchPanel(tab) {
  document.querySelectorAll('.ptab').forEach(b=>b.classList.toggle('active',b.dataset.panel===tab));
  document.getElementById('panelInfo').style.display  = tab==='info'?'':'none';
  document.getElementById('panelBom').style.display   = tab==='bom' ?'':'none';
  document.getElementById('panelProc').style.display  = tab==='proc'?'':'none';
}

function downloadBom() {
  location.href=`/api/layout/bom-excel?tph=${TPH}&stages=${STAGES}&material=${encodeURIComponent(MAT)}&client=Client`;
}

// ── Resize ─────────────────────────────────────────────────────────
function onResize() {
  const w=canvas.clientWidth, h=canvas.clientHeight;
  renderer.setSize(w,h,false);
  perspCam.aspect=w/h; perspCam.updateProjectionMatrix();
  if (currentView!=='3d') {
    const aspect=w/h, vw=plantLen*1.35, vh=vw/aspect;
    orthoCam.left=-vw/2; orthoCam.right=vw/2;
    orthoCam.top=vh/2; orthoCam.bottom=-vh/2;
    orthoCam.updateProjectionMatrix();
  }
}

// ── Animate ────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, activeCamera);
}

// ── Load Data ──────────────────────────────────────────────────────
async function load() {
  try {
    const url=`/api/layout/3d-data?tph=${TPH}&stages=${STAGES}&material=${encodeURIComponent(MAT)}`;
    const ctrl = new AbortController();
    const tid = setTimeout(()=>ctrl.abort(), 30000);
    const resp=await fetch(url,{credentials:'include', signal:ctrl.signal});
    clearTimeout(tid);
    if (!resp.ok) {
      // If redirected to login, show auth error
      const ct = resp.headers.get('content-type')||'';
      if (resp.status===401 || resp.status===403 || resp.url.includes('/login'))
        throw new Error(`Not authenticated (HTTP ${resp.status}) — please reload and log in again`);
      const body = ct.includes('json') ? (await resp.json()).detail : await resp.text();
      throw new Error(`HTTP ${resp.status}: ${body||'Server error'}`);
    }
    const data=await resp.json();
    plantLen = data.plant_length_m||80;

    const st=(data.procurement_bom||{}).summary_stats||{};
    document.getElementById('plantTitle').textContent=`🏗️ PROMAN ${STAGES}-Stage ${TPH} TPH ${MAT} Plant`;
    document.getElementById('statsBar').textContent=
      `Plant length: ${plantLen}m  ·  Structural: ${st.total_structural_mt||'—'} MT  ·  `+
      `Load: ~${Math.round(st.est_connected_kw||0)} kW  ·  Belt: ${st.belt_width_mm||'—'}mm  ·  Belts: ${st.conveyor_count||'—'}`;

    perspCam.position.set(plantLen/2, plantLen*0.36, plantLen*0.52);
    controls.target.set(plantLen/2, 5, 0);
    controls.update();

    buildScene(data.positions);
    populatePanels(data);
    document.getElementById('loading').style.display='none';
  } catch(err) {
    document.getElementById('loading').innerHTML=
      `<div style="color:#f87171;font-size:13px">⚠ Failed to load: ${err.message}<br>Check console for details.</div>`;
    console.error(err);
  }
}

function showFatalError(msg) {
  const el = document.getElementById('loading');
  el.style.display = 'block';   // keep visible even if load() hides it
  el.style.pointerEvents = 'auto';
  el.innerHTML =
    `<div style="color:#f87171;font-size:13px;max-width:360px;line-height:1.8;background:#1a0a0a;border:1px solid #5a1a1a;border-radius:8px;padding:16px">
      <b style="font-size:14px">⚠ Failed to load 3D viewer</b><br><br>
      <span style="color:#fca5a5;word-break:break-all">${msg}</span><br><br>
      <span style="color:#5a7a9a;font-size:11px">Open browser DevTools → Console tab for the full stack trace.</span>
    </div>`;
}
let _initOk = false;
try { init(); _initOk = true; } catch(e) { showFatalError('3D init error: ' + e.message); console.error('init() threw:', e); }
if (_initOk) load().catch(e => showFatalError('Data load error: ' + e.message));
</script>
</body>
